# Server Port
server.port=8081

# Spring Application Name
spring.application.name=finops-agent-assistant

# =========================================================
# MySQL DATABASE CONFIGURATION
# =========================================================
# Automatically creates database 'finops_db' if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/finops_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# Hibernate / JPA Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# =========================================================
# (Optional) H2 In-Memory Database Fallback
# To use H2 instead of MySQL, uncomment these lines:
# spring.datasource.url=jdbc:h2:mem:finopsdb;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
